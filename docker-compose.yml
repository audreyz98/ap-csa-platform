services:
  db:
    image: postgres:16-alpine
    container_name: ap_csa_db
    environment:
      POSTGRES_USER: apcsa
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: apcsa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
